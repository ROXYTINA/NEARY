name: salon_beauty_app
description: Salon & Beauty booking discovery app — Flutter group project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Images
  cached_network_image: ^3.3.1

  # Calendar
  table_calendar: ^3.1.2

  # UI extras
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.1.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  intl: ^0.19.0
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  lottie: ^3.1.0
  confetti: ^0.7.0
  pinch_zoom: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/

